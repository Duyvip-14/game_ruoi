<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Fly!</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for a fun, playful look -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #86efac; /* Tailwind green-300 */
            background-image: radial-gradient(#4ade80 20%, transparent 20%), radial-gradient(#4ade80 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            overflow: hidden; /* Prevent scrolling on mobile */
            touch-action: manipulation; /* Prevent double-tap zoom on touch devices */
        }

        /* Game Board Styling - Wooden look */
        .game-board {
            background-color: #d97706; /* amber-600 */
            border: 12px solid #92400e; /* amber-900 */
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3), inset 0 0 20px rgba(0,0,0,0.5);
        }

        /* Hole Styling */
        .hole {
            background-color: #451a03; /* amber-950 */
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 8px 15px rgba(0,0,0,0.8), 0 2px 0 rgba(255,255,255,0.2);
            /* Aspect ratio 1:1 trick for older browsers or fallback */
            aspect-ratio: 1 / 1;
        }

        /* The Fly */
        .fly {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            font-size: 4rem; /* Adjust based on cell size */
            cursor: pointer;
            transition: transform 0.1s ease-out;
            user-select: none;
            -webkit-user-select: none;
            /* Disable pointer events by default, enable when active */
            pointer-events: none;
            line-height: 1;
        }

        /* Active Fly state (popped up) */
        .hole.active .fly {
            transform: translateX(-50%) translateY(10%);
            pointer-events: auto;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Bouncy pop up */
        }

        /* Splat effect when whacked */
        .fly.splat {
            transform: translateX(-50%) translateY(10%) scale(0.2) rotate(45deg);
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease-in;
        }

        /* Responsive adjustments for the fly emoji size */
        @media (max-width: 640px) {
            .fly {
                font-size: 3rem;
            }
        }
        @media (max-width: 400px) {
            .fly {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-lg w-full bg-white/90 backdrop-blur-sm rounded-3xl shadow-2xl p-6 sm:p-8 relative">
        
        <!-- Header: Title, Score, and Timer -->
        <div class="text-center mb-6">
            <h1 class="text-4xl sm:text-5xl font-bold text-amber-800 mb-4 drop-shadow-sm flex justify-center items-center gap-2">
                <span>🦟</span> Whack-a-Fly! <span>🦟</span>
            </h1>
            
            <div class="flex justify-between items-center bg-amber-100 rounded-xl p-4 shadow-inner border-2 border-amber-200">
                <div class="text-xl sm:text-2xl font-semibold text-gray-700 flex flex-col">
                    <span class="text-sm text-gray-500 uppercase tracking-wider">Score</span>
                    <span id="score" class="text-3xl text-amber-600 font-bold">0</span>
                </div>
                <div class="text-xl sm:text-2xl font-semibold text-gray-700 flex flex-col text-right">
                    <span class="text-sm text-gray-500 uppercase tracking-wider">Time Left</span>
                    <span id="time" class="text-3xl text-red-500 font-bold">30</span>
                </div>
            </div>
        </div>

        <!-- Game Board -->
        <div class="game-board p-3 sm:p-5 mb-6">
            <div class="grid grid-cols-3 gap-3 sm:gap-4">
                <!-- 9 Holes generated statically for simplicity and performance -->
                <div class="hole" id="hole-0"><div class="fly">🦟</div></div>
                <div class="hole" id="hole-1"><div class="fly">🦟</div></div>
                <div class="hole" id="hole-2"><div class="fly">🦟</div></div>
                <div class="hole" id="hole-3"><div class="fly">🦟</div></div>
                <div class="hole" id="hole-4"><div class="fly">🦟</div></div>
                <div class="hole" id="hole-5"><div class="fly">🦟</div></div>
                <div class="hole" id="hole-6"><div class="fly">🦟</div></div>
                <div class="hole" id="hole-7"><div class="fly">🦟</div></div>
                <div class="hole" id="hole-8"><div class="fly">🦟</div></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex justify-center">
            <button id="start-btn" class="bg-gradient-to-b from-green-400 to-green-600 hover:from-green-500 hover:to-green-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition active:scale-95 text-xl w-full sm:w-auto border-b-4 border-green-800">
                Start Game
            </button>
        </div>

        <!-- Game Over Overlay (Hidden by default) -->
        <div id="overlay" class="absolute inset-0 bg-black/70 rounded-3xl flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 z-10 hidden">
            <div class="bg-white p-8 rounded-2xl shadow-2xl text-center transform scale-95 transition-transform duration-300" id="overlay-content">
                <h2 class="text-4xl font-bold text-red-500 mb-2">Time's Up!</h2>
                <p class="text-xl text-gray-600 mb-6">You squashed</p>
                <div class="text-6xl font-bold text-amber-500 mb-6 flex items-center justify-center gap-2">
                    <span id="final-score">0</span>
                    <span class="text-4xl">🦟</span>
                </div>
                <button id="restart-btn" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition active:scale-95 text-xl w-full border-b-4 border-amber-700">
                    Play Again
                </button>
            </div>
        </div>

    </div>

    <script>
        // DOM Elements
        const holes = document.querySelectorAll('.hole');
        const scoreBoard = document.getElementById('score');
        const timeBoard = document.getElementById('time');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const overlayContent = document.getElementById('overlay-content');
        const finalScore = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const flies = document.querySelectorAll('.fly');

        // Game State Variables
        let lastHole;
        let timeUp = false;
        let score = 0;
        let timeLeft = 30;
        let countdownTimer;
        let flyTimer;
        let isPlaying = false;

        // Constants
        const GAME_DURATION = 30; // seconds
        const FLY_DURATION_MIN = 600; // ms
        const FLY_DURATION_MAX = 1000; // ms

        /**
         * Get a random amount of time between min and max
         */
        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        /**
         * Pick a random hole for the fly to appear from
         */
        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            
            // Prevent the same hole from being chosen twice in a row
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        /**
         * Make a fly pop up from a hole
         */
        function peep() {
            const time = randomTime(FLY_DURATION_MIN, FLY_DURATION_MAX);
            const hole = randomHole(holes);
            
            // Show the fly
            hole.classList.add('active');
            
            // Reset splat state if it was whacked previously
            const fly = hole.querySelector('.fly');
            fly.textContent = '🦟'; // Reset emoji
            fly.classList.remove('splat');

            // Hide the fly after 'time' milliseconds
            flyTimer = setTimeout(() => {
                hole.classList.remove('active');
                if (!timeUp) {
                    peep(); // Show next fly
                }
            }, time);
        }

        /**
         * Start or Restart the game
         */
        function startGame() {
            if (isPlaying) return;
            
            // Reset state
            scoreBoard.textContent = '0';
            timeBoard.textContent = GAME_DURATION;
            timeUp = false;
            score = 0;
            timeLeft = GAME_DURATION;
            isPlaying = true;
            
            // Hide overlay if it's open
            hideOverlay();
            
            // Update UI
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');

            // Clear any existing flies
            holes.forEach(hole => hole.classList.remove('active'));
            clearTimeout(flyTimer);

            // Start showing flies
            peep();

            // Start countdown timer
            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                timeLeft--;
                timeBoard.textContent = timeLeft;
                
                // Add a warning color when time is low
                if(timeLeft <= 10) {
                    timeBoard.classList.add('text-red-600', 'animate-pulse');
                } else {
                    timeBoard.classList.remove('text-red-600', 'animate-pulse');
                }

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        /**
         * End the game and show results
         */
        function endGame() {
            timeUp = true;
            isPlaying = false;
            clearInterval(countdownTimer);
            clearTimeout(flyTimer);
            
            // Reset start button
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            
            // Ensure all holes close
            holes.forEach(hole => hole.classList.remove('active'));

            // Show Game Over Overlay
            setTimeout(() => {
                finalScore.textContent = score;
                showOverlay();
            }, 500); // slight delay to let the last fly disappear
        }

        /**
         * Handle clicking/whacking a fly
         */
        function whack(e) {
            // Ensure the click is valid (prevent simulated clicks)
            if (!e.isTrusted) return; 
            
            // Only count if it's currently active (not already whacked)
            if(!this.classList.contains('splat')) {
                score++;
                scoreBoard.textContent = score;
                
                // Splat effect
                this.textContent = '💥'; // Change emoji to splat
                this.classList.add('splat');
                
                // We don't remove 'active' from the parent hole immediately 
                // to let the animation play out. The timeout in peep() will clean it up,
                // or we can force it closed after a short delay:
                const parentHole = this.parentNode;
                setTimeout(() => {
                    parentHole.classList.remove('active');
                }, 200);
            }
        }

        function showOverlay() {
            overlay.classList.remove('hidden');
            // Small delay to allow display:block to apply before animating opacity
            setTimeout(() => {
                overlay.classList.remove('opacity-0', 'pointer-events-none');
                overlayContent.classList.remove('scale-95');
                overlayContent.classList.add('scale-100');
            }, 10);
        }

        function hideOverlay() {
            overlay.classList.add('opacity-0', 'pointer-events-none');
            overlayContent.classList.remove('scale-100');
            overlayContent.classList.add('scale-95');
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300); // Wait for transition to finish
        }

        // Event Listeners
        flies.forEach(fly => {
            // Support both click and touch for mobile responsiveness
            fly.addEventListener('click', whack);
            fly.addEventListener('touchstart', function(e) {
                e.preventDefault(); // Prevent double firing from touch + click
                whack.call(this, e);
            }, {passive: false});
        });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

    </script>
</body>
</html>
