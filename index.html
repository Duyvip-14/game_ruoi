<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Fly! 🦟</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #a3e6cd; /* Light mint green background */
            background-image: radial-gradient(#80c9b0 10%, transparent 10%);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevent scrolling */
        }

        #game-container {
            background-color: #fffaf0; /* White panel */
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #5d4037;
            font-size: 2rem;
            margin: 0 0 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #dashboard {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 15px;
            background-color: #fff8e1;
            padding: 10px;
            border-radius: 10px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .stat {
            text-transform: uppercase;
            font-size: 0.9rem;
            color: #8d6e63;
        }

        .stat-value {
            font-size: 1.5rem;
            color: #a52a2a;
            font-weight: bold;
        }

        #grid-panel {
            background-color: #d88e44; /* Brown wooden panel */
            border-radius: 15px;
            border: 5px solid #a66a33;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 10px;
            width: 100%;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }

        .hole {
            background-color: #5d4037; /* Dark brown hole */
            border-radius: 50%;
            aspect-ratio: 1; /* Keep round */
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        .fly {
            font-size: 2.5rem;
            display: none; /* Hidden by default */
            position: absolute;
            bottom: -50px;
            transition: bottom 0.2s ease-out; /* Pop-up animation */
        }

        .hole.has-fly .fly {
            display: block;
            bottom: 0;
        }

        .splat {
            font-size: 2.5rem;
            display: none;
            position: absolute;
            color: #ff5722;
        }

        .hole.splatted .splat {
            display: block;
        }

        .score-popup {
            position: absolute;
            font-size: 1.2rem;
            color: #ff5722;
            font-weight: bold;
            display: none;
            animation: popupFade 0.5s ease-out;
            top: -30px;
            right: 0;
        }

        .hole.splatted .score-popup {
            display: block;
        }

        @keyframes popupFade {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-30px); }
        }

        #controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        #start-btn {
            background: linear-gradient(#81c784, #4caf50);
            border: none;
            border-radius: 20px;
            color: white;
            padding: 10px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s, box-shadow 0.1s;
            margin-bottom: 10px;
        }

        #start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }

        #start-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        #status-text {
            color: #5d4037;
            font-size: 0.9rem;
            min-height: 1.2rem;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <h1><span></span> Whack-a-Fly! <span></span></h1>
        
        <div id="dashboard">
            <div>
                <div class="stat">SCORE</div>
                <div id="score" class="stat-value">0</div>
            </div>
            <div>
                <div class="stat">TIME LEFT</div>
                <div id="time" class="stat-value">30</div>
            </div>
        </div>
        
        <div id="grid-panel">
            <div class="hole"><div class="fly"></div><div class="splat"></div><div class="score-popup">+1!</div></div>
            <div class="hole"><div class="fly"></div><div class="splat"></div><div class="score-popup">+1!</div></div>
            <div class="hole"><div class="fly"></div><div class="splat"></div><div class="score-popup">+1!</div></div>
            <div class="hole"><div class="fly"></div><div class="splat"></div><div class="score-popup">+1!</div></div>
            <div class="hole"><div class="fly"></div><div class="splat"></div><div class="score-popup">+1!</div></div>
            <div class="hole"><div class="fly"></div><div class="splat"></div><div class="score-popup">+1!</div></div>
            <div class="hole"><div class="fly"></div><div class="splat"></div><div class="score-popup">+1!</div></div>
            <div class="hole"><div class="fly"></div><div class="splat"></div><div class="score-popup">+1!</div></div>
            <div class="hole"><div class="fly"></div><div class="splat"></div><div class="score-popup">+1!</div></div>
        </div>
        
        <div id="controls">
            <button id="start-btn">START GAME</button>
            <div id="status-text">Click to start!</div>
        </div>
    </div>

    <script>
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const holes = document.querySelectorAll('.hole');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');

        let lastHole;
        let score = 0;
        let timeLimit = 30; // 30 seconds
        let countdownInterval;
        let isPlaying = false;

        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        function randomHole(holesList) {
            const idx = Math.floor(Math.random() * holesList.length);
            const hole = holesList[idx];
            if (hole === lastHole) return randomHole(holesList);
            lastHole = hole;
            return hole;
        }

        function peep() {
            if (!isPlaying) return;
            const time = randomTime(500, 1500); // 0.5s to 1.5s
            const hole = randomHole(holes);
            hole.classList.add('has-fly');
            setTimeout(() => {
                hole.classList.remove('has-fly');
                if (!isPlaying) return;
                peep(); // Recursive call for the next fly
            }, time);
        }

        function startGame() {
            if (isPlaying) return;
            
            score = 0;
            timeLimit = 30;
            scoreEl.textContent = score;
            timeEl.textContent = timeLimit;
            isPlaying = true;
            startBtn.disabled = true;
            statusText.textContent = "Game started! Tap the flies!";

            peep();

            countdownInterval = setInterval(() => {
                timeLimit--;
                timeEl.textContent = timeLimit;
                if (timeLimit <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            clearInterval(countdownInterval);
            isPlaying = false;
            startBtn.disabled = false;
            startBtn.textContent = "PLAY AGAIN";
            statusText.textContent = "Game over! You scored: " + score;
            holes.forEach(hole => hole.classList.remove('has-fly'));
        }

        function whackFly(e) {
            if (!isPlaying) return;
            const hole = e.currentTarget;
            if (!hole.classList.contains('has-fly')) return;

            // Successful hit
            score++;
            scoreEl.textContent = score;
            hole.classList.remove('has-fly'); // Fly disappears

            // Optional splat effect
            hole.classList.add('splatted');
            setTimeout(() => hole.classList.remove('splatted'), 400); // Splat fades
        }

        // Add event listeners
        startBtn.addEventListener('click', startGame);
        holes.forEach(hole => {
            hole.addEventListener('click', whackFly);
        });

    </script>
</body>
</html>
